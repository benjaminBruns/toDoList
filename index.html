<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
        <title>Personal To-do list</title>
    </head>
    <body>
        <h1>To-do List</h1>
        <form id="taskInputForm" autocomplete="off">
            <button id="taskAddButton" class="taskInput">+</button>
            <input type="text" class="taskInput" id="taskText" placeholder="Add a task...">
            <input type="date" class="taskInput" id="taskDueDateInput">
        </form>
        <div id="taskListContainer">

        </div>
        <div id="clearCompletedTasksContainer">
            <button id="clearCompletedTasksButton">Clear Completed Tasks</button>
        </div>
        <div id="sortTasksContainer">
            <label for="sortTasksDropdown">Sort tasks </label>
            <select id="sortTasksDropdown">
                <option value="alphabet">Alphabetically</option>
                <option value="complete">Completed</option>
                <option value="newest">Newest Task Created</option>
                <option value="oldest">Oldest Task Created</option>
                <option value="dueDate">Due Date</option>
            </select>
        </div>
    <script src="script.js"></script>
    </body>
</html>
