<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Personal To-do list</title>
    </head>
    <body>
        <h1>To-do List</h1>
        <form id="taskInputForm" autocomplete="off">
            <button id="taskAddButton" class="taskInput">+</button>
            <input type="text" class="taskInput" id="taskText" placeholder="Add a task...">
            <label for="taskDueDateInput" id="dueDateLabel">Add a Due Date: </label>
            <input type="date" class="taskInput" id="taskDueDateInput">
            <label for="taskCategoryInput" id="categoryLabel">Add a Category: </label>
            <select class="taskInput" id="taskCategoryInput">
            </select>
        </form>
        <div id="categoryForms">
            <form id="categoryInputForm" autocomplete="off">
                <button id="categoryAddButton" class="categoryInput">+</button>
                <input type="color" class="categoryInput" id="categoryColorInput" value="#EAA9A9">
                <input type="text" class="categoryInput" id="categoryNameInput" placeholder="Add a category...">
            </form>
            <form id="deleteCategoryForm" autocomplete="off">
                <button id="categoryDeleteButton" class="categoryDelete">-</button>
                <input type="text" id="categoryDeleteText" class="categoryDelete" placeholder="Delete a category...">
            </form>
        </div>
        <div id="taskListContainer">

        </div>
        <div id="clearCompletedTasksContainer">
            <button id="clearCompletedTasksButton">Clear Completed Tasks</button>
        </div>
        <div id="sortTasksContainer">
            <label for="sortTasksDropdown">Sort tasks </label>
            <select id="sortTasksDropdown">
                <option value="alphabet">Alphabetically</option>
                <option value="complete">Completed</option>
                <option value="newest">Newest First</option>
                <option value="oldest">Oldest First</option>
                <option value="dueDate">Due Date</option>
                <option value="category">Category</option>
            </select>
        </div>
    <script src="script.js"></script>
    </body>
</html>
