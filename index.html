<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
        <title>Personal To-do list</title>
    </head>
    <body>
        <h1>To-do List</h1>
        <form id="taskInputForm" autocomplete="off">
            <button id="taskAddButton">+</button>
            <input type="text" id="taskInput" placeholder="Add a task...">
        </form>
        <div id="taskListContainer">

        </div>
        <div id="clearCompletedTasksContainer">
            <button id="clearCompletedTasksButton">Clear Completed Tasks</button>
        </div>
    <script src="script.js"></script>
    </body>
</html>
